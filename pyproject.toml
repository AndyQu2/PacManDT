[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pacman-dt"
version = "0.1.0"
description = "A Gymnasium-compatible Pac-Man environment with silent (headless) and human rendering modes, plus Decision-Transformer trajectory collection and training."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "PacManDT contributors" }]
keywords = ["reinforcement-learning", "gymnasium", "pacman", "environment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.24",
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch>=2.0", "transformers>=4.30", "datasets>=3.0"]
rl = ["stable-baselines3>=2.0"]
hub = ["datasets>=3.0", "huggingface_hub>=0.26"]

[tool.setuptools.packages.find]
include = ["pacman_env*", "dt*"]

[tool.setuptools.package-data]
pacman_env = ["assets/*.txt", "assets/*/*.lay", "assets/*/*.gif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::DeprecationWarning:pacman_env.*",
    "error::DeprecationWarning:dt.data.*",
]
